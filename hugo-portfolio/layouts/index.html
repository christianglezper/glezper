<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.Title }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:4rem 1.5rem;line-height:1.5}
    main{max-width:900px;margin:0 auto}
    h1{font-size:clamp(2.5rem,8vw,6rem);line-height:.95;margin:0 0 1.5rem}
    p{font-size:1.2rem;max-width:48rem}
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>
</body>
</html>
